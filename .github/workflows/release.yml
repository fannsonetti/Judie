name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend
        run: npm ci

      # Installers only (no updater signing). Re-enable createUpdaterArtifacts + TAURI_SIGNING_* later.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Judie ${{ github.ref_name }}
          releaseBody: |
            ## Windows
            Install `Judie_*_x64-setup.exe`.

            ## Raspberry Pi (32-bit)
            Install the `.deb` from the Linux armhf assets, or see [docs/raspberry-pi.md](docs/raspberry-pi.md).
            Pi 3 (1 GB) should run **32-bit Raspberry Pi OS**.
          releaseDraft: false
          prerelease: false

  linux-armv7:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Armhf sysroot
        run: bash scripts/ci-armhf-sysroot.sh

      - name: Install frontend
        run: npm ci

      # tauri-action looks for *_armv7.deb; the bundler correctly names Debian packages *_armhf.deb.
      - name: Build armhf .deb
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: "1"
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: "1"
          PKG_CONFIG_SYSROOT_DIR: /opt/armhf
          PKG_CONFIG_LIBDIR: /opt/armhf/usr/lib/arm-linux-gnueabihf/pkgconfig:/opt/armhf/usr/share/pkgconfig
          PKG_CONFIG_PATH: /opt/armhf/usr/lib/arm-linux-gnueabihf/pkgconfig:/opt/armhf/usr/share/pkgconfig
          CFLAGS: --sysroot=/opt/armhf
          CXXFLAGS: --sysroot=/opt/armhf
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          BINDGEN_EXTRA_CLANG_ARGS_armv7_unknown_linux_gnueabihf: --sysroot=/opt/armhf
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS: -C link-arg=--sysroot=/opt/armhf -C link-arg=-lsystemd
        run: npm run tauri build -- --target armv7-unknown-linux-gnueabihf --config src-tauri/tauri.linux.conf.json

      - name: Upload armhf .deb to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/deb/*_armhf.deb
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
