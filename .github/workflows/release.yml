name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-armv7:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Armhf sysroot
        run: bash scripts/ci-armhf-sysroot.sh

      - name: Build native Pi binary + .deb
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: "1"
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: "1"
          PKG_CONFIG_SYSROOT_DIR: /opt/armhf
          PKG_CONFIG_LIBDIR: /opt/armhf/usr/lib/arm-linux-gnueabihf/pkgconfig:/opt/armhf/usr/share/pkgconfig
          PKG_CONFIG_PATH: /opt/armhf/usr/lib/arm-linux-gnueabihf/pkgconfig:/opt/armhf/usr/share/pkgconfig
          CFLAGS: --sysroot=/opt/armhf
          CXXFLAGS: --sysroot=/opt/armhf
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          BINDGEN_EXTRA_CLANG_ARGS_armv7_unknown_linux_gnueabihf: --sysroot=/opt/armhf
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS: -C link-arg=--sysroot=/opt/armhf
          CARGO_TARGET: armv7-unknown-linux-gnueabihf
        run: |
          set -euo pipefail
          cd src-tauri
          cargo build --release --no-default-features --features pi-native --bin judie-pi --target armv7-unknown-linux-gnueabihf
          cd ..
          bash scripts/package-armhf-deb.sh
          bash scripts/ci-check-armhf-deb.sh

      - name: Create release and upload armhf .deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/deb/*_armhf.deb)
          if (( ${#files[@]} == 0 )); then
            echo "No armhf .deb found" >&2
            exit 1
          fi
          cp "${files[0]}" /tmp/judie_armhf.deb
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "Judie ${{ github.ref_name }}" \
              --notes "Raspberry Pi 32-bit native Slint kiosk .deb (no WebKit). Windows is unsupported beginning with v0.2.14. See docs/raspberry-pi.md. Pi 3 (1 GB) should run 32-bit Raspberry Pi OS."
          fi
          gh release upload "${{ github.ref_name }}" "${files[@]}" /tmp/judie_armhf.deb --clobber
