name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend
        run: npm ci

      # Installers only (no updater signing). Re-enable createUpdaterArtifacts + TAURI_SIGNING_* later.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Judie ${{ github.ref_name }}
          releaseBody: |
            ## Windows
            Install `Judie_*_x64-setup.exe`.

            ## Raspberry Pi (32-bit)
            Native Slint kiosk `.deb` (no WebKit). See [docs/raspberry-pi.md](docs/raspberry-pi.md).
            Pi 3 (1 GB) should run **32-bit Raspberry Pi OS**.
          releaseDraft: false
          prerelease: false

  linux-armv7:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Armhf sysroot
        run: bash scripts/ci-armhf-sysroot.sh

      - name: Build native Pi binary + .deb
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: "1"
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: "1"
          PKG_CONFIG_SYSROOT_DIR: /opt/armhf
          PKG_CONFIG_LIBDIR: /opt/armhf/usr/lib/arm-linux-gnueabihf/pkgconfig:/opt/armhf/usr/share/pkgconfig
          PKG_CONFIG_PATH: /opt/armhf/usr/lib/arm-linux-gnueabihf/pkgconfig:/opt/armhf/usr/share/pkgconfig
          CFLAGS: --sysroot=/opt/armhf
          CXXFLAGS: --sysroot=/opt/armhf
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          BINDGEN_EXTRA_CLANG_ARGS_armv7_unknown_linux_gnueabihf: --sysroot=/opt/armhf
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS: -C link-arg=--sysroot=/opt/armhf
        run: |
          set -euo pipefail
          cd src-tauri
          cargo build --release --no-default-features --features pi-native --bin judie-pi --target armv7-unknown-linux-gnueabihf
          cd ..
          bash scripts/package-armhf-deb.sh

      - name: Upload armhf .deb to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/deb/*_armhf.deb)
          if (( ${#files[@]} == 0 )); then
            echo "No armhf .deb found" >&2
            exit 1
          fi
          for _ in $(seq 1 90); do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for release ${{ github.ref_name }}" >&2
          exit 1
