name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend
        run: npm ci

      # Installers only (no updater signing). Re-enable createUpdaterArtifacts + TAURI_SIGNING_* later.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Judie ${{ github.ref_name }}
          releaseBody: |
            ## Windows
            Install `Judie_*_x64-setup.exe`.

            ## Raspberry Pi (32-bit)
            Install the `.deb` from the Linux armhf assets, or see [docs/raspberry-pi.md](docs/raspberry-pi.md).
            Pi 3 (1 GB) should run **32-bit Raspberry Pi OS**.
          releaseDraft: false
          prerelease: false

  linux-armv7:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Armhf sysroot
        run: bash scripts/ci-armhf-sysroot.sh

      - name: Install frontend
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Judie ${{ github.ref_name }}
          args: --target armv7-unknown-linux-gnueabihf --config src-tauri/tauri.linux.conf.json
          releaseDraft: false
          prerelease: false
